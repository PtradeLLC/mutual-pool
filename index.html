<!doctype html>
<html lang="en" class="h-full bg-[#F8FAFC] text-[#111827]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MutualPool • We Pool. We Grow. We Deliver.</title>
    <meta name="theme-color" content="#005FB8" />
    <meta name="description" content="MutualPool - Mutual savings pods (Trusted Circle & Open Pods) with Stripe Treasury integration and perks marketplace for delivery drivers." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-[#F8FAFC] font-sans antialiased selection:bg-[#005FB8] selection:text-white">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        if (location.protocol === 'https:' && !location.hostname.includes('localhost') && !location.hostname.includes('127.0.0.1')) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => {
              console.log('SW registration failed: ', err);
            });
          });
        } else {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
        }
      }
    </script>
  </body>
</html>
